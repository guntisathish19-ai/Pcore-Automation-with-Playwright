name: Playwright Nightly Tests

on:
  schedule:
    # Runs every night at 01:00 IST (19:30 UTC)
    - cron: '30 19 * * *'
  workflow_dispatch:  # ✅ allows manual trigger

jobs:
  nightly-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Nightly Playwright Tests
        env:
          CI: true
        run: npx playwright test --config=playwright.nightly.config.js

      - name: Upload Nightly Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-nightly-report
          path: playwright-report-nightly
          retention-days: 14